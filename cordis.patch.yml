- insert:
    - id: dsh-plugin-enhance
      name: dsh-plugin-enhance
      config: {}
    - id: dsh-plugin-enhance-session-query
      name: cordis:group
      group: true
      isolate:
        sessionQuery: true
      config:
        - id: dsh-plugin-enhance-session-query-backend
          name: '@deepseek-ai/dsh-session-query-sqlite'
          config:
            path: ':memory:'
            openAt: first-search
        - id: dsh-plugin-enhance-session-query-tool
          name: dsh-plugin-enhance/session-query
          config: {}
