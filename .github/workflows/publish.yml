name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Verify version tag
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match package version v${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${version.includes('-') ? 'next' : 'latest'}\n`);
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build and test
        run: npm run check
      - name: Publish package
        run: npm publish --access public --provenance --tag "${{ steps.version.outputs.dist_tag }}"
